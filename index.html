      present:"지금은 각자의 자유를 존중하면서도, 관계의 방향성을 맞추는 조율이 필요합니다. 서로 다른 리듬을 이해해야 합니다.",
      future: "함께 성장하고 모험을 즐긴다면, 자유롭고 끈끈한 특별한 관계로 발전할 수 있습니다. 그러나 방황하거나 흩어질 위험도 함께 존재합니다."
    },
    solo: {
      past:   "무한한 가능성을 지닌 사람을 만났지만 어설픈 행동으로 좋은 마무리를 하지 못했었다.",
      present:"지금은 새로운 사람을 만나는 것에 열려 있지만, 관계에 깊이 몰입하는 데에는 아직 조심스러운 부분이 있을 수 있습니다.",
      future: "1~3개월 이내에 모험심이 강하고 유쾌한 인연을 만날 수 있습니다."
    }
  }
}
      // ... 04 ~ 78 카드 추가
    ];

    const shuffleBtn=document.getElementById('shuffle'), drawBtn=document.getElementById('draw'), modeSel=document.getElementById('mode-select'), popup=document.getElementById('popup'), popupClose=document.getElementById('popup-close'), popupCont=document.getElementById('popup-content'); let shuffled=[];
    shuffleBtn.addEventListener('click',()=>{
      const pool=[...cards]; shuffled=[];
      while(shuffled.length<3){const i=Math.floor(Math.random()*pool.length); shuffled.push(pool.splice(i,1)[0]);}
      document.querySelectorAll('.card').forEach(div=>{div.style.backgroundImage="url('images/back.png')"; div.onclick=null;});
      drawBtn.disabled=false;
    });
    drawBtn.addEventListener('click',()=>{
      const mode=modeSel.value;
      document.querySelectorAll('.card').forEach((div,i)=>{
        const c=shuffled[i];
        div.style.backgroundImage = `url('${c.img}')`;
        div.onclick = ()=>{
          const m=c.meaning[mode];
          popupCont.innerHTML = `<h2>${c.id}번 카드 – ${mode==='couple'?'커플':'솔로'}</h2>`+
            `<p><strong>과거:</strong> ${m.past}</p>`+
            `<p><strong>현재:</strong> ${m.present}</p>`+
            `<p><strong>미래:</strong> ${m.future}</p>`;
          popup.style.display='block';
        };
      });
      drawBtn.disabled=true;
    });
    popupClose.addEventListener('click',()=>popup.style.display='none');
  </script>
</body>
</html>
